<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Carlos Adenge</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Shop</h1>
      <div class="cart-info">
        Cart: <span id="cart-count">0</span> items |
        Total: KES <span id="cart-total">0</span>
        <button id="clear-cart">Clear Cart</button>
      </div>
    </header>

    <section>
      <h2>Products</h2>
      <div id="products" class="products"></div>
    </section>

    <section>
      <h2>Your Cart</h2>
      <ul id="cart-list"></ul>
    </section>
  </div>

  <script src="cart.js"></script>
</body>
</html>
